<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">AI Dota 2 Tracker</title>
  <desc id="description">A dark red and gold banner with a stylized map and the text: Know your hero. Plan your next move. Builds, matchups, Immortal stats.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1f1420"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#background)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <ellipse cx="1060" cy="190" rx="400" ry="300" fill="url(#glow)"/>
  <path d="M 48 48 H 84" stroke="#e63946" stroke-width="4"/>
  <text x="100" y="54" fill="#e3b675" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3">DOTA 2 / AI ASSISTANT</text>
  <text x="64" y="145" fill="#f4f1ed" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700">Know your hero.</text>
  <text x="64" y="215" fill="#f4f1ed" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700">Plan your next move.</text>
  <text x="66" y="266" fill="#a6aab8" font-family="Segoe UI, Arial, sans-serif" font-size="20">Game knowledge meets Immortal bracket statistics.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.5" font-weight="600">
    <rect x="64" y="308" width="110" height="34" rx="6" fill="#e63946" fill-opacity="0.12" stroke="#e63946" stroke-opacity="0.4"/>
    <text x="119" y="330" text-anchor="middle" fill="#f28b92">BUILDS</text>
    <rect x="186" y="308" width="140" height="34" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="256" y="330" text-anchor="middle" fill="#c9cbd3">MATCHUPS</text>
    <rect x="338" y="308" width="174" height="34" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="425" y="330" text-anchor="middle" fill="#c9cbd3">IMMORTAL STATS</text>
  </g>
  <g transform="translate(1030 196)">
    <rect x="-115" y="-115" width="230" height="230" rx="12" transform="rotate(45)" fill="#13151e" stroke="#e63946" stroke-opacity="0.35"/>
    <path d="M -125 0 H 125 M 0 -125 V 125" fill="none" stroke="#36303d" stroke-width="1"/>
    <path d="M -102 80 L -102 -12 L -20 -96 M -102 80 L -20 80 L 102 -42 M -102 80 L 102 -96" fill="none" stroke="#e3b675" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M -91 -59 C -22 -46 -12 46 86 60" fill="none" stroke="#6084ad" stroke-opacity="0.5" stroke-width="9"/>
    <g fill="#e3b675">
      <circle cx="-102" cy="80" r="9"/>
      <circle cx="-102" cy="-12" r="5"/>
      <circle cx="-20" cy="80" r="5"/>
      <circle cx="-34" cy="21" r="5"/>
    </g>
    <g fill="#e63946">
      <circle cx="102" cy="-96" r="9"/>
      <circle cx="-20" cy="-96" r="5"/>
      <circle cx="102" cy="-42" r="5"/>
      <circle cx="35" cy="-38" r="5"/>
    </g>
    <circle cx="-34" cy="21" r="15" fill="none" stroke="#e3b675" stroke-opacity="0.4"/>
    <circle cx="35" cy="-38" r="15" fill="none" stroke="#e63946" stroke-opacity="0.4"/>
  </g>
  <text x="1030" y="375" text-anchor="middle" fill="#857e90" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="3">BUILD / LEARN / ADAPT</text>
</svg>
